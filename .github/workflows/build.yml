name: Build Niebla Mística

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Comprobar estructura del proyecto
        run: |
          echo "=== RAÍZ DEL REPOSITORIO ==="
          ls -la

          echo ""
          echo "=== BUSCANDO PROYECTOS GRADLE ==="

          find . \
            -path './.git' -prune -o \
            -name 'settings.gradle' \
            -print

          echo ""
          echo "=== COMPROBANDO SRC ==="

          if [ ! -d "src/main/java" ]; then
            echo "ERROR: falta src/main/java"
            echo "La estructura del proyecto está mal colocada."
            exit 1
          fi

          if [ ! -d "src/main/resources" ]; then
            echo "ERROR: falta src/main/resources"
            exit 1
          fi

          if [ ! -f "build.gradle" ]; then
            echo "ERROR: falta build.gradle"
            exit 1
          fi

          if [ ! -f "settings.gradle" ]; then
            echo "ERROR: falta settings.gradle"
            exit 1
          fi

          echo ""
          echo "ESTRUCTURA CORRECTA"

      - name: Compilar mod
        run: |
          chmod +x gradlew 2>/dev/null || true
          gradle build --no-daemon

      - name: Mostrar JAR generado
        run: |
          echo "=== JARS GENERADOS ==="
          find build/libs -type f -name '*.jar' -ls

      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: niebla-mistica-jar
          path: build/libs/*.jar
